name: Source architecture contracts

on:
  push:
    branches: [dev, main, "feature/ui-reorganization-v2"]
  pull_request:
    branches: [dev, main, "feature/ui-reorganization-v2"]

permissions:
  contents: read

jobs:
  verify-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify OPENWORKS current architecture
        run: python3 scripts/verify_source.py
      - name: Verify procedural prefab geometry topology
        run: python3 scripts/check_prefab_geometry.py
      - name: Verify mechanical prefab integration contracts
        run: python3 scripts/check_prefab_integration.py
      - name: Verify native shaft-speed gearbox transfer integration
        run: python3 scripts/check_gear_transfer.py
      - name: Verify gearbox runtime reliability and hub repair
        run: python3 scripts/check_gear_reliability.py
      - name: Verify persistent precision mesh publication pipeline
        run: python3 scripts/check_published_meshes.py
      - name: Verify video gearbox contact regression
        run: python3 scripts/check_gear_video_regression.py
      - name: Verify crank-to-gear drive chain and failure diagnostics
        run: python3 scripts/check_crank_to_gear_chain.py
      - name: Verify virtual shaft load, speed graph and live drive diagnostics
        run: python3 scripts/check_gear_torque_budget.py
      - name: Verify tooth phase-lock and stop-on-release braking
        run: python3 scripts/check_gear_phase_and_braking.py
      - name: Verify cardinal tooth gaps and in-line spur chain geometry
        run: python3 scripts/check_cardinal_gear_geometry.py
      - name: Verify staged replacement gear mesh publisher
        run: python3 scripts/check_mesh_replacement_transaction.py
      - name: Verify Edit-mode primitive and component duplication
        run: python3 scripts/check_edit_duplication.py
      - name: Verify compact gear bores, Edit copy fitting and rotation stop
        run: python3 scripts/check_compact_gears_copy_fit_stop.py

  parse-luau:
    name: Parse Luau sources (no formatting gate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned StyLua parser/formatter
        uses: JohnnyMorganz/stylua-action@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          version: "2.1.0"
          args: false
      - name: Parse and verify all client/shared/server Luau syntax
        # --verify re-parses generated code and validates AST equivalence.
        # It reformats the runner's disposable checkout, never commits changes.
        # Do not use --check: code style is not the goal of this safety gate.
        run: stylua --verify --syntax luau src scripts/studio/OpenworksPermanentMeshPublisher.plugin.lua
